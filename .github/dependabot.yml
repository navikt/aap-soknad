version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.READER_TOKEN }}
updates:
  - package-ecosystem: 'docker'
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *" # 1 og 15 hver måned
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: 'cgr-nav/pull-through/nav.no/node'
    groups:
      all:
        patterns:
          - '*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *" # 1 og 15 hver måned
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    groups:
      all:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *" # 1 og 15 hver måned
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
      exclude:
        - '@navikt/aap*'
        - '@navikt/aksel*'
        - '@navikt/ds*'
    open-pull-requests-limit: 10
    registries: '*'
    ignore:
      - dependency-name: '*'
        update-types: [ 'version-update:semver-major' ]
      - dependency-name: '@navikt/eslint-config-aap'
      - dependency-name: 'prettier'
      - dependency-name: '@typescript-eslint*'
      - dependency-name: 'eslint-*'
      - dependency-name: 'eslint'
        versions: [ '9.x' ]
    groups:
      aap-deps:
        patterns:
          - '@navikt/aap*'
      aksel-dependencies:
        patterns:
          - '@navikt/aksel*'
          - '@navikt/ds*'
      react-dependencies:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      testing:
        patterns:
          - 'vitest'
          - 'vitest-fetch-mock'
          - '@vitest/coverage-v8'
          - '@vitejs/plugin-react'
          - '@testing-library/react'
          - '@testing-library/user-event'
          - '@testing-library/dom'
          - '@testing-library/jest-dom'
          - 'jsdom'
      metrics:
        patterns:
          - '@grafana/*'
          - '@opentelemetry/api'
          - '@opentelemetry/api-logs'
          - '@opentelemetry/instrumentation'
          - '@opentelemetry/resources'
          - '@opentelemetry/sdk-logs'
          - '@opentelemetry/sdk-metrics'
          - '@opentelemetry/sdk-trace-base'
          - '@vercel/otel'
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      misc:
        patterns:
          - '*'
