name: Bygg og deploy AAP Søknad
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
jobs:
  buildDev:
    uses: navikt/aap-workflows/.github/workflows/frontend-next-build.yml@main
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit
    with:
      cluster: dev-gcp
      appname: 'aap-soknad'
      playwright: true
      cdn: true
  buildProd:
    uses: navikt/aap-workflows/.github/workflows/frontend-next-build.yml@main
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit
    if: github.ref == 'refs/heads/main'
    with:
      cluster: prod-gcp
      appname: 'aap-soknad'
      playwright: true
      cdn: true
  deployDev:
    needs: buildDev
    uses: navikt/aap-workflows/.github/workflows/deploy.yml@main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      cluster: dev-gcp
      manifest: .nais/nais.yaml
      imageSuffix: -dev-gcp
      vars: .nais/dev.yaml
  deployProd:
    needs: [buildProd, deployDev]
    uses: navikt/aap-workflows/.github/workflows/deploy.yml@main
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main'
    secrets: inherit
    with:
      cluster: prod-gcp
      manifest: .nais/nais.yaml
      imageSuffix: -prod-gcp
      vars: .nais/prod.yaml
